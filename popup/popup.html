<!DOCTYPE html>

<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Поиск на странице</title>

  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="../lib/icons.css">
  <link rel="stylesheet" href="popup.css">

</head>

<body>

  <header class="header">

    <h1>Поиск</h1>

    <div class="header-actions">

    <button type="button" id="btn-reader" class="btn-icon icon-chip-btn" title="Открыть в читателе" aria-label="Открыть в читателе">
      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="bookOpen" data-ws-icon-size="16"></span></span>
    </button>

    <button type="button" id="btn-reader-exit" class="btn-icon icon-chip-btn" title="К оригиналу" aria-label="К оригиналу" hidden>
      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="arrowLeft" data-ws-icon-size="16"></span></span>
    </button>

    <button type="button" id="btn-dock" class="btn-icon icon-chip-btn" title="Закрепить у края экрана" aria-label="Закрепить у края экрана">
      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="panelRight" data-ws-icon-size="16"></span></span>
    </button>

    <button type="button" id="btn-settings" class="btn-icon icon-chip-btn" title="Настройки" aria-label="Настройки">
      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="settings" data-ws-icon-size="16"></span></span>
    </button>

    </div>

  </header>



  <div class="page-info-card">

    <div class="page-info-row">

      <span class="page-info-label">Сайт</span>

      <span id="page-site" class="page-info-value">—</span>

    </div>

    <div class="page-info-row">

      <span class="page-info-label">Заголовок</span>

      <span id="page-title" class="page-info-value">—</span>

    </div>

  </div>



  <div class="search-row">

    <div class="search-input-wrap">

      <span class="search-field-icon" aria-hidden="true">
        <span class="icon-chip icon-chip-xs" data-ws-icon="search" data-ws-icon-size="14"></span>
      </span>

      <input type="text" id="query" placeholder="Фраза, кот | пёс, -слово" autocomplete="off" spellcheck="false" title="Слова подряд — фраза, в том числе через теги. | или, &amp; оба в блоке, кавычки — точно, -слово пропускает блок, * маска. ё и е совпадают.">

      <button type="button" id="btn-clear" class="btn-clear icon-chip-btn" hidden aria-label="Очистить поиск" title="Очистить">
        <span class="icon-chip icon-chip-xs" aria-hidden="true"><span data-ws-icon="x" data-ws-icon-size="12"></span></span>
      </button>

    </div>

    <button type="button" id="btn-search" class="btn-primary">Найти</button>

  </div>



  <div class="selection-row">

    <button type="button" id="btn-find-selection" class="btn-selection" title="Искать выделенный на странице текст">

      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="textSelect" data-ws-icon-size="14"></span></span>

      <span>Найти выделенное</span>

    </button>

  </div>



  <div class="options-card">

    <label class="option-row">

      <span class="option-label">Учитывать регистр</span>

      <input type="checkbox" id="opt-case" class="toggle">

    </label>

    <label class="option-row">

      <span class="option-label">Целое слово</span>

      <input type="checkbox" id="opt-whole" class="toggle">

    </label>

    <label class="option-row">

      <span class="option-label">Формы слова</span>

      <input type="checkbox" id="opt-morph" class="toggle">

    </label>

  </div>



  <div class="options-card annotation-card">

    <label class="option-row option-row-icon">

      <span class="option-label">

        <span class="icon-chip icon-chip-sm" id="annotation-mode-icon" aria-hidden="true"><span data-ws-icon="highlighter" data-ws-icon-size="14"></span></span>

        <span>Режим аннотаций</span>

      </span>

      <input type="checkbox" id="opt-annotation-mode" class="toggle">

    </label>

    <p id="annotation-status" class="annotation-status" aria-live="polite"></p>

  </div>



  <div class="nav-row">

    <button type="button" id="btn-prev" class="btn-nav icon-chip-btn" disabled aria-label="Предыдущее">
      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="chevronLeft" data-ws-icon-size="14"></span></span>
    </button>

    <span id="counter" class="counter">0 из 0</span>

    <button type="button" id="btn-next" class="btn-nav icon-chip-btn" disabled aria-label="Следующее">
      <span class="icon-chip icon-chip-sm" aria-hidden="true"><span data-ws-icon="chevronRight" data-ws-icon-size="14"></span></span>
    </button>

  </div>



  <p id="status" class="status" aria-live="polite"></p>



  <script src="../lib/defaults.js"></script>
  <script src="../lib/theme-accent.js"></script>
  <script src="../lib/settings-storage.js"></script>
  <script src="../lib/injection-manifest.js"></script>
  <script src="../lib/icon-paths.js"></script>
  <script src="../lib/icons.js"></script>

  <script src="popup.js"></script>

</body>

</html>
